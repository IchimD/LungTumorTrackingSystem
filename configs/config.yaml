# Training configuration for U-Net segmentation model
# Usage: python -m src.training.train --config configs/config.yaml

data:
  image_dir: "data/processed/images"
  mask_dir: "data/processed/masks"
  train_fraction: 0.7
  val_fraction: 0.15
  test_fraction: 0.15
  background_ratio: 0.3  # Ratio of background slices to lesion slices

model:
  in_channels: 1
  out_channels: 1
  base_channels: 32
  bilinear: true

training:
  epochs: 40
  batch_size: 8
  learning_rate: 0.001
  num_workers: 4
  seed: 42
  augment: true

loss:
  type: "bce_dice"  # Options: bce_dice, dice, bce
  bce_weight: 0.5   # Weight for BCE in BCEDiceLoss (0.5 = 50% Dice, 50% BCE)

evaluation:
  threshold: 0.5    # Probability threshold for binary predictions
  val_interval: 1   # Validate every N epochs

output:
  output_dir: "checkpoints"
  save_best: true
  checkpoint_name: "best_model"
